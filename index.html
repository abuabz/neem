<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neem | Launching Soon</title>
<style>
:root{--ink:#26271a;--gold:#e0b274;--lime:#b7d63a;--cream:#f3ead8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--cream);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(800px 500px at 90% 100%,rgba(224,178,116,.28),transparent 60%),linear-gradient(160deg,#262718,#2b2a1a 60%,#40361f)}
main{max-width:520px;width:100%}
img{width:min(300px,70vw);height:auto;display:block;margin:0 auto 36px}
h1{margin:0 0 10px;font-size:clamp(1.8rem,6vw,2.6rem);font-weight:600;letter-spacing:-.01em;color:var(--lime)}
p{margin:0 0 20px;line-height:1.6;color:#d8cfba}
a{display:inline-block;padding:12px 26px;border-radius:99px;background:var(--lime);color:#1b2108;text-decoration:none;font-weight:500}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.lf{position:absolute;top:-80px;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) translateX(0) rotate(0)}50%{transform:translateY(55vh) translateX(30px) rotate(160deg)}100%{transform:translateY(115vh) translateX(-20px) rotate(330deg)}}
main{position:relative;animation:in 1.2s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
img{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(224,178,116,0))}50%{filter:drop-shadow(0 0 22px rgba(224,178,116,.45))}}
h1{background:linear-gradient(100deg,#b7d63a 30%,#f3ead8 50%,#b7d63a 70%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.dots span{display:inline-block;width:9px;height:9px;margin:0 5px 30px;border-radius:50%;background:var(--gold);animation:bob 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
